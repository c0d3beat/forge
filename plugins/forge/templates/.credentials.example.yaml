# forge credentials — copy to <your-project>/forge/.credentials.yaml and fill in.
# NEVER COMMIT — this file must be gitignored.
# Quote any token that contains spaces, a leading ':' , or ' #'.

atlassian:
  # ONE Atlassian API token authenticates BOTH Confluence and JIRA.
  # Create it at id.atlassian.net > Security > Create and manage API tokens.
  email: you@example.com
  apiToken: ""

sonarqube:
  # A SonarQube USER token: SonarQube > My Account > Security > Generate Tokens.
  token: ""

github:
  # OPTIONAL — leave "" and use the gh CLI (gh auth login). Set a PAT only if needed.
  token: ""
